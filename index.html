<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dotyk Slov — DS9 šablóna</title>
  <style>
    :root{color-scheme:light;--ink:#0b0b0b;--paper:#f5f4f0;--acid:#d9ff45}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:500 16px/1.55 system-ui,sans-serif}.card{width:min(820px,100%);padding:clamp(30px,7vw,76px);border-radius:28px;background:#fff;box-shadow:0 34px 100px rgba(11,11,11,.1)}small{font-weight:800;letter-spacing:.13em}h1{max-width:680px;margin:26px 0 18px;font-size:clamp(48px,9vw,96px);line-height:.86;letter-spacing:-.075em}p{max-width:610px;color:#66635e}.actions{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px}a{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:999px;color:var(--ink);font-size:13px;font-weight:750;text-decoration:none}a:first-child{background:var(--ink);color:#fff}.pill{display:inline-block;margin-top:38px;padding:8px 11px;border-radius:999px;background:var(--acid);font-size:10px;font-weight:800;letter-spacing:.08em}
  </style>
</head>
<body>
  <main class="card">
    <small>DOTYK SLOV / DS9</small>
    <h1>Šablóna, ktorú vieš meniť bez rozbitia obchodu.</h1>
    <p>Produkty a objednávky ostávajú v Shoptete. Texty, farby a vlastné editorial sekcie upravíš vo vizuálnom editore.</p>
    <div class="actions"><a href="./admin/">Otvoriť editor</a><a href="https://808782.myshoptet.com/">Otvoriť testovací obchod</a></div>
    <span class="pill">RELEASE 9.0.0</span>
  </main>
</body>
</html>
