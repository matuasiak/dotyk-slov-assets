name: Theme v2 build

on:
  push:
    branches:
      - refactor/vite-theme
  pull_request:
    paths:
      - 'src/**'
      - 'css/**'
      - 'js/**'
      - 'vite.config.js'
      - 'package.json'
      - 'tools/deploy-template-includes.mjs'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build theme
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dotyk-slov-theme-v2
          path: dist/
